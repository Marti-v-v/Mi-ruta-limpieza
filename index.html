<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ruta de Limpieza</title>
<meta name="theme-color" content="#0f8a74">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f6f5; --card:#ffffff; --fg:#17302b; --muted:#5d7570; --line:#d5e2de;
  --accent:#0f8a74; --accent-soft:#dff2ec; --warn:#b06a0c; --warn-soft:#fbefd9; --home:#3a5a9b; --danger:#b3261e;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --card:#172321; --fg:#e4efec; --muted:#93aaa4; --line:#2a3a37;
  --accent:#2fae93; --accent-soft:#183a33; --warn:#e9a845; --warn-soft:#3a2e17; --home:#8aa6e0; --danger:#f2938c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --card:#172321; --fg:#e4efec; --muted:#93aaa4; --line:#2a3a37;
  --accent:#2fae93; --accent-soft:#183a33; --warn:#e9a845; --warn-soft:#3a2e17; --home:#8aa6e0; --danger:#f2938c; color-scheme:dark}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1;min-width:70px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 6px;font:600 .8rem var(--font);cursor:pointer}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.money{margin:-6px 0 14px;font-size:.9rem;color:var(--muted)}
.money b{color:var(--fg)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.bar{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bar h1{margin:0;font-size:1.2rem;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.salir{border:1px solid rgba(255,255,255,.6);background:none;color:#fff;border-radius:8px;padding:5px 10px;font:600 .8rem var(--font);cursor:pointer;flex:none}
.auth{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:400px;margin:10px auto 0}
.auth>img{border-radius:18px}
.auth h2{margin:0;font-size:1.4rem}
.auth .card{width:100%}
.err{color:var(--danger);font-size:.85rem;font-weight:600}
.ok{color:var(--accent);font-size:.85rem;font-weight:600}
.btn.link{border:0;background:none;color:var(--accent);padding:6px}
.wrap{max-width:640px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(90px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
h3{margin:0;font-size:1.05rem}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{border:0;background:none;color:var(--muted);font:600 .75rem var(--font);padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.weeknav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.weeknav b{min-width:9em;text-align:center;text-transform:capitalize}
.days{grid-template-columns:repeat(7,1fr)!important;gap:4px}
.days.six{grid-template-columns:repeat(6,1fr)!important}
.days button{padding:6px 0}
.days button b{font-size:1.05rem}
.days button.hoy{border-color:var(--accent)}
.chip.soft{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:.85rem}
.movebox{display:flex;flex-direction:column;gap:8px;padding-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .ch{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);padding:2px 0}
.cd{aspect-ratio:1/1.15;max-width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;min-width:0}
.cd .n{font-size:.8rem;font-weight:600;position:relative}
.cd .mk{position:absolute;top:-1px;right:-7px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.cd .c{font-size:.95rem;font-weight:700;color:var(--accent);line-height:1.1}
.cd .hh{font-size:.62rem;color:var(--muted)}
.cd.lleno{background:var(--accent-soft)}
.cd.fuera{opacity:.35}
.cd.hoy{border-color:var(--accent);border-width:2px}
.cd.sel{outline:2px solid var(--fg);outline-offset:-2px}
.nav{grid-template-columns:repeat(5,1fr)}
.days button.vacio{opacity:.55}
.days button.libre{background:var(--warn-soft)}
.cd.libre{background:var(--warn-soft)}
.banner.libreb{border-color:var(--line)}
.real{font-size:.8rem;color:var(--muted)}
.real input{width:78px;padding:4px 6px}
.cobro{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.cobro .cinfo{display:flex;flex-direction:column;min-width:0}
.cobro.pagado .cinfo b{color:var(--accent)}
a.btn{display:inline-block;color:var(--fg)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table.anio{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.88rem}
.anio th,.anio td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.anio th:first-child,.anio td:first-child{text-align:left;font-weight:600}
.anio th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.anio tbody tr{cursor:pointer}
.anio tr.actual{background:var(--accent-soft)}
.anio tbody tr:last-child td{border-bottom:0}

.nav button span{font-size:1.3rem;line-height:1}
.nav button.on{color:var(--accent)}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
.days button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 0;cursor:pointer;font:700 .85rem var(--font);display:flex;flex-direction:column;align-items:center;gap:2px}
.days button small{font:500 .7rem var(--font);color:var(--muted)}
.days button.on{border-color:var(--accent);background:var(--accent-soft)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.sum b{display:block;font-size:1.1rem;font-variant-numeric:tabular-nums}
.sum span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.start{display:flex;align-items:center;gap:8px;margin-bottom:12px;color:var(--muted);font-size:.9rem}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;width:100%}
.start input{width:auto}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stop,.travel{display:grid;grid-template-columns:50px 1fr;gap:10px}
.time{font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;text-align:right;padding-top:12px}
.node{position:relative;padding-left:20px;padding-bottom:6px;min-width:0}
.node::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:2px;background:var(--line)}
.stop .node::after{content:"";position:absolute;left:0;top:15px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.stop .node.home::after{border-color:var(--home);border-radius:3px}
.travel .node{padding-block:4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meta{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.between{justify-content:space-between}
.chip{font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--accent);color:#fff}
.trip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.trip input{width:64px;padding:4px 6px}
a{color:var(--accent);font-weight:600;text-decoration:none}
.btn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 12px;cursor:pointer;font:600 .85rem var(--font)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.78rem}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.4}
.add{display:flex;gap:8px;margin-top:12px}
.add select{flex:1}
.empty{color:var(--muted);text-align:center;padding:20px;border:1px dashed var(--line);border-radius:12px}
.list{display:flex;flex-direction:column;gap:10px}
form.card{gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:.85rem;z-index:9}
.confirm{background:var(--warn-soft);border-color:var(--warn)}
</style>
</head>
<body>
<header class="bar"><h1 id="titulo">Mi ruta</h1><button id="salir" class="salir" onclick="salir()" hidden>Salir</button></header>
<main class="wrap" id="view"></main>
<nav class="nav" id="nav" hidden>
  <button id="tab-semana" class="on" onclick="setTab('semana')"><span>📍</span>Semana</button>
  <button id="tab-mes" onclick="setTab('mes')"><span>🗓️</span>Mes</button>
  <button id="tab-plan" onclick="setTab('plan')"><span>↻</span>Plan</button>
  <button id="tab-casas" onclick="setTab('casas')"><span>🏠</span>Casas</button>
  <button id="tab-copia" onclick="setTab('copia')"><span>⚙️</span>Ajustes</button>
</nav>
<div class="toast" id="toast" hidden></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const DIAS=[["lun","Lun","Lunes"],["mar","Mar","Martes"],["mie","Mié","Miércoles"],["jue","Jue","Jueves"],["vie","Vie","Viernes"],["sab","Sáb","Sábado"],["dom","Dom","Domingo"]];
const LLAVE={tiene:"Tiene copia",recoger:"Recoger llave",abren:"Le abren"};
const AJ_DEF={modo:"transit",tema:"auto",inicio:"08:00",trayecto:15,precio:0,ultimaCopia:null};
const MODOS={transit:"🚌 Bus/metro",driving:"🚗 Coche",walking:"🚶 A pie",bicycling:"🚲 Bici"};
function normalizar(){
  S.ajustes=Object.assign({},AJ_DEF,S.ajustes||{});S.fechas=S.fechas||{};S.llaves=S.llaves||{};
  S.libres=S.libres||[];S.cobros=S.cobros||{};S.reales=S.reales||{};
  if(!S.ajustes.ultimaCopia)S.ajustes.ultimaCopia=iso(new Date());
  S.casas.forEach(c=>{c.pausas=c.pausas||[];c.tel=c.tel||"";c.precio=+c.precio||0});
  const ref=iso(lunes(new Date()));
  DIAS.forEach(([k])=>{S.semana[k]=S.semana[k]||{inicio:"08:00",paradas:[],vuelta:15};S.semana[k].paradas.forEach(p=>{p.freq=p.freq||"s";p.ref=p.ref||ref;delete p.llaveOk})});
  const lim30=iso(addD(new Date(),-30)),lim2y=iso(addD(new Date(),-730));
  Object.keys(S.llaves).forEach(f=>{if(f<lim30)delete S.llaves[f]});
  [S.fechas,S.reales].forEach(o=>Object.keys(o).forEach(f=>{if(f<lim2y)delete o[f]}));
  S.libres=S.libres.filter(l=>(l.hasta||l.desde)>=lim2y);
  aplicarTema();
}
function aplicarTema(){const t=S&&S.ajustes?S.ajustes.tema:"auto";if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}
const VACIO=()=>({home:{direccion:"",poblacion:""},casas:[],semana:Object.fromEntries(DIAS.map(([k])=>[k,{inicio:"08:00",paradas:[],vuelta:15}])),fechas:{},llaves:{},libres:[],cobros:{},reales:{}});
const EJEMPLO={
  home:{direccion:"Rambla de la Marina 120",poblacion:"L'Hospitalet"},
  casas:[
    {id:"c1",nombre:"Casa Ferrer (ejemplo)",poblacion:"Cornellà",direccion:"Av. Sant Ildefons 18, 3º2ª",horas:3,tel:"600111222",precio:12,llave:"tiene",llaveNota:"Llavero azul",notas:"Planchar camisas"},
    {id:"c2",nombre:"Piso Martínez (ejemplo)",poblacion:"Esplugues",direccion:"C/ Laureà Miró 210",horas:2,tel:"600333444",precio:0,llave:"recoger",llaveNota:"Conserjería",notas:"Perro en casa"},
    {id:"c3",nombre:"Casa Puig (ejemplo)",poblacion:"Sant Joan Despí",direccion:"C/ Major 45",horas:4,llave:"abren",llaveNota:"La señora está",notas:""}
  ],
  semana:{
    lun:{inicio:"08:00",paradas:[{casa:"c1",trayecto:15,freq:"s"},{casa:"c2",trayecto:12,freq:"q"}],vuelta:20},
    mar:{inicio:"08:30",paradas:[{casa:"c3",trayecto:18,freq:"s"}],vuelta:18},
    mie:{inicio:"08:00",paradas:[{casa:"c2",trayecto:20,freq:"m1"}],vuelta:15},
    jue:{inicio:"08:00",paradas:[{casa:"c1",trayecto:15,freq:"s"},{casa:"c3",trayecto:10,freq:"mu"}],vuelta:18},
    vie:{inicio:"09:00",paradas:[],vuelta:15},
    sab:{inicio:"09:00",paradas:[],vuelta:15},
    dom:{inicio:"09:00",paradas:[],vuelta:15}
  }
};
const OLD_KEY="rutaLimpieza.v1", K_USERS="rutaLimpieza.usuarios";
let S=null,U=null,tab="semana",editId=null,pedirBorrar=null,authModo="login",authError="",authInfo="";
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- FIREBASE ---------- */
const FB_OK=typeof firebase!=="undefined"&&window.FIREBASE_CONFIG&&!String(FIREBASE_CONFIG.apiKey||"").startsWith("PEGA");
let auth=null,db=null,unsub=null,tGuardar=null,ultimoJson="",appVisible=false;
if(FB_OK){
  firebase.initializeApp(FIREBASE_CONFIG);
  auth=firebase.auth();auth.languageCode="es";
  db=firebase.firestore();
  db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
}
const docRef=()=>db.collection("usuarios").doc(U.uid);
/* Guardar: espera un momento y sube todo de una vez. Sin cobertura queda en el móvil y se sube al volver. */
const save=()=>{if(!U)return;clearTimeout(tGuardar);tGuardar=setTimeout(escribir,600)};
function escribir(){
  if(!U||!S)return;const j=JSON.stringify(S);if(j===ultimoJson)return;ultimoJson=j;
  docRef().set({json:j,email:U.email,actualizado:firebase.firestore.FieldValue.serverTimestamp()})
    .catch(e=>toast("No se ha podido guardar ("+e.code+")"));
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(tGuardar);escribir()}});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* Datos de la versión anterior (sin nube) para no perderlos al pasar a Firebase */
function datosLocales(email){
  const u=(ls.get(K_USERS)||[]).find(x=>x.email===email);
  const d=u?ls.get("rutaLimpieza.datos."+u.id):ls.get(OLD_KEY);
  return d&&d.casas?d:null;
}
function mostrarApp(){appVisible=true;$("nav").hidden=false;$("salir").hidden=false;setTab("semana")}
function alEntrar(user){
  U=user;appVisible=false;
  $("view").innerHTML=`<div class="empty">Cargando tus datos…</div>`;$("titulo").textContent="Mi ruta";
  const vigilancia=setTimeout(()=>{if(!appVisible)$("view").innerHTML=`<div class="empty">No llegan los datos. Revisa la conexión. Si es la primera vez, necesitas internet.</div>`},10000);
  unsub=docRef().onSnapshot({includeMetadataChanges:false},snap=>{
    if(snap.metadata.hasPendingWrites)return;
    if(!snap.exists){
      if(snap.metadata.fromCache&&!navigator.onLine)return;
      S=datosLocales(U.email)||JSON.parse(JSON.stringify(EJEMPLO));normalizar();
      clearTimeout(vigilancia);escribir();mostrarApp();return;
    }
    const j=snap.data().json;if(j===ultimoJson&&appVisible)return;
    try{S=JSON.parse(j)}catch(e){toast("Datos dañados en la nube");return}
    ultimoJson=j;normalizar();clearTimeout(vigilancia);
    if(!appVisible)mostrarApp();else render();
  },err=>{clearTimeout(vigilancia);$("view").innerHTML=`<div class="empty">No se pueden leer los datos (${esc(err.code)}). Revisa las reglas de Firestore.</div>`});
}
function salir(){clearTimeout(tGuardar);escribir();if(unsub)unsub();unsub=null;auth.signOut()}
function alSalir(){U=null;S=null;ultimoJson="";appVisible=false;aplicarTema();authError="";pintarAuth()}

const ERR={"auth/email-already-in-use":"Ya hay una cuenta con ese correo. Entra o recupera la contraseña.","auth/invalid-email":"Ese correo no es válido.","auth/weak-password":"La contraseña necesita al menos 6 caracteres.",
  "auth/invalid-credential":"Correo o contraseña incorrectos.","auth/wrong-password":"Contraseña incorrecta.","auth/user-not-found":"No hay ninguna cuenta con ese correo.",
  "auth/too-many-requests":"Demasiados intentos. Espera unos minutos.","auth/network-request-failed":"Sin conexión. Para entrar o crear cuenta necesitas internet.","auth/missing-email":"Escribe tu correo."};
const errTxt=e=>ERR[e&&e.code]||"Algo ha fallado ("+(e&&e.code||"desconocido")+").";

function pintarAuth(){
  $("nav").hidden=true;$("salir").hidden=true;
  const reg=authModo==="registro",olvido=authModo==="olvido";
  $("titulo").textContent=reg?"Crear cuenta":olvido?"Recuperar contraseña":"Iniciar sesión";
  if(!FB_OK){$("view").innerHTML=`<div class="empty">Falta configurar Firebase. Rellena el archivo firebase-config.js con los datos de tu proyecto.</div>`;return}
  let h=`<div class="auth"><img src="icon-192.png" alt="" width="72" height="72"><h2>Mi Ruta</h2>`;
  if(olvido){
    h+=`<form class="card" onsubmit="event.preventDefault();recuperar()" novalidate>
      <div class="meta">Te enviamos un correo con un enlace para poner una contraseña nueva.</div>
      <label>Correo electrónico<input id="aEmail" type="email" autocomplete="email" placeholder="nombre@gmail.com"></label>
      <div class="err" id="aErr" ${authError?"":"hidden"}>${esc(authError)}</div>
      ${authInfo?`<div class="ok">${esc(authInfo)}</div>`:""}
      <button class="btn pri" id="aBtn">Enviar correo</button></form>
      <div class="row" style="justify-content:center"><button class="btn link" onclick="authModo='login';authError='';authInfo='';pintarAuth()">Volver a entrar</button></div>`;
  }else{
    h+=`<form class="card" onsubmit="event.preventDefault();${reg?"registrar()":"login()"}" novalidate>
      <label>Correo electrónico<input id="aEmail" type="email" autocomplete="email" autocapitalize="none" placeholder="nombre@gmail.com"></label>
      ${reg?`<label>Nombre de usuario<input id="aUser" autocomplete="nickname" placeholder="María"></label>`:""}
      <label>Contraseña<input id="aPass" type="password" autocomplete="${reg?"new-password":"current-password"}"></label>
      ${reg?`<label>Repite la contraseña<input id="aPass2" type="password" autocomplete="new-password"></label><div class="meta">Mínimo 6 caracteres.</div>`:""}
      <div class="err" id="aErr" ${authError?"":"hidden"}>${esc(authError)}</div>
      ${authInfo?`<div class="ok">${esc(authInfo)}</div>`:""}
      <button class="btn pri" id="aBtn">${reg?"Crear cuenta":"Entrar"}</button></form>
      <div class="row" style="justify-content:center">${reg
        ?`<button class="btn link" onclick="authModo='login';authError='';authInfo='';pintarAuth()">Ya tengo cuenta</button>`
        :`<button class="btn link" onclick="authModo='registro';authError='';authInfo='';pintarAuth()">Crear cuenta nueva</button><button class="btn link" onclick="authModo='olvido';authError='';authInfo='';pintarAuth()">He olvidado la contraseña</button>`}</div>`;
  }
  $("view").innerHTML=h+`</div>`;
}
function errAuth(t){authError=t;const e=$("aErr");e.textContent=t;e.hidden=false;const b=$("aBtn");if(b)b.disabled=false}

const toMin=t=>{const[h,m]=(t||"08:00").split(":").map(Number);return h*60+m};
const hhmm=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(Math.round(m%60)).padStart(2,"0");
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${h}h${r?" "+r+"m":""}`:`${r} min`};
const full=p=>[p.direccion,p.poblacion].filter(Boolean).join(", ");
const maps=(a,b)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(full(a))}&destination=${encodeURIComponent(full(b))}&travelmode=${(S.ajustes||AJ_DEF).modo}`;
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}

/* ---------- FECHAS ---------- */
const MESES=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const SEM7=DIAS.map(([k,n])=>[k,n]);
const LARGO=Object.fromEntries(DIAS.map(([k,,l])=>[k,l]));
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const lunes=d=>addD(d,-((d.getDay()+6)%7));
const k7=d=>DIAS[(d.getDay()+6)%7][0];
const keyDia=d=>k7(d);
const fCorta=d=>`${d.getDate()} ${MESES[d.getMonth()].slice(0,3)}`;
const HOY=()=>iso(new Date());
const mesKey=(y,m)=>`${y}-${pad(m+1)}`;
const Mayus=s=>s[0].toUpperCase()+s.slice(1);
let fecha=HOY();
let mesVista=(()=>{const d=new Date();return {y:d.getFullYear(),m:d.getMonth()}})();
let vistaAnual=false, diaPlan=k7(new Date()), movId=null, pausaId=null;

/* ---------- FRECUENCIA ---------- */
const FREQ={s:"Cada semana",q:"Cada 2 semanas",m1:"1ª semana del mes",m2:"2ª semana del mes",m3:"3ª semana del mes",m4:"4ª semana del mes",mu:"Última semana del mes"};
const FREQC={s:"",q:"cada 2 sem.",m1:"1ª del mes",m2:"2ª del mes",m3:"3ª del mes",m4:"4ª del mes",mu:"última del mes"};
function aplica(p,d){
  const f=p.freq||"s";
  if(f==="s")return true;
  if(f==="q"){const w=Math.round((lunes(d)-fromIso(p.ref))/6048e5);return Math.abs(w)%2===0}
  if(f==="mu")return addD(d,7).getMonth()!==d.getMonth();
  return Math.ceil(d.getDate()/7)===+f.slice(1);
}

/* ---------- DÍAS LIBRES Y PAUSAS ---------- */
const libreDe=f=>S.libres.find(l=>l.desde<=f&&f<=(l.hasta||l.desde));
const pausada=(c,f)=>(c.pausas||[]).some(p=>p.desde<=f&&f<=p.hasta);
function pascua(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia)}
function festivosCat(y){
  const P=pascua(y);
  return [["01-01","Año Nuevo"],["01-06","Reyes"],[null,"Viernes Santo",addD(P,-2)],[null,"Lunes de Pascua",addD(P,1)],["05-01","Fiesta del Trabajo"],["06-24","Sant Joan"],["08-15","Asunción"],["09-11","Diada"],["10-12","Fiesta Nacional"],["11-01","Todos los Santos"],["12-06","Constitución"],["12-08","Inmaculada"],["12-25","Navidad"],["12-26","Sant Esteve"]]
    .map(([md,n,d])=>({f:d?iso(d):`${y}-${md}`,n}));
}
function addFestivos(y){
  let n=0;festivosCat(y).forEach(({f,n:nota})=>{if(!S.libres.some(l=>l.desde===f&&l.tipo==="festivo")){S.libres.push({id:"l"+Date.now()+n,tipo:"festivo",desde:f,hasta:f,nota});n++}});
  S.libres.sort((a,b)=>a.desde.localeCompare(b.desde));save();render();toast(`${n} festivos añadidos`);
}

/* Plan de una fecha: los cambios del día mandan; luego días libres; luego plantilla con frecuencias y pausas */
function plan(f){
  if(S.fechas[f])return {...S.fechas[f],cambiado:true};
  const d=fromIso(f),t=S.semana[k7(d)],lib=libreDe(f);
  if(lib)return {inicio:t.inicio,vuelta:t.vuelta,paradas:[],cambiado:false,libre:lib};
  return {inicio:t.inicio,vuelta:t.vuelta,paradas:t.paradas.filter(p=>{const c=casa(p.casa);return c&&aplica(p,d)&&!pausada(c,f)}).map(p=>({casa:p.casa,trayecto:p.trayecto,freq:p.freq})),cambiado:false};
}
function fijar(f){
  if(!S.fechas[f]){const p=plan(f);S.fechas[f]={inicio:p.inicio,vuelta:p.vuelta,paradas:p.paradas.map(x=>({casa:x.casa,trayecto:x.trayecto}))}}
  return S.fechas[f];
}
function proximas(p,k,n=3){
  const out=[];let d=fromIso(HOY());while(k7(d)!==k)d=addD(d,1);
  for(let i=0;i<60&&out.length<n;i++,d=addD(d,7)){const f=iso(d);if(aplica(p,d)&&!libreDe(f)&&!pausada(casa(p.casa)||{},f))out.push(fCorta(d))}
  return out;
}
function calc(d){
  let t=toMin(d.inicio),trab=0,tray=0;const out=[];
  d.paradas.forEach((p,i)=>{const c=casa(p.casa);if(!c)return;t+=+p.trayecto||0;tray+=+p.trayecto||0;
    out.push({p,c,i,llega:t,sale:t+c.horas*60});t+=c.horas*60;trab+=c.horas*60});
  if(out.length){t+=+d.vuelta||0;tray+=+d.vuelta||0}
  return{out,fin:t,trab,tray};
}

/* ---------- DINERO Y HORAS ---------- */
const precioDe=c=>+c.precio>0?+c.precio:(+S.ajustes.precio||0);
const hayPrecio=()=>S.ajustes.precio>0||S.casas.some(c=>+c.precio>0);
const horasDe=(f,c)=>{const r=S.reales[f]&&S.reales[f][c.id];return r!=null?r:c.horas};
const eurDia=f=>calc(plan(f)).out.reduce((t,{c})=>t+horasDe(f,c)*precioDe(c),0);
function resumenMes(y,m){
  const R={dias:0,visitas:0,horas:0,tray:0,eur:0,porCasa:{}};
  for(let d=new Date(y,m,1);d.getMonth()===m;d=addD(d,1)){
    const f=iso(d),r=calc(plan(f));if(!r.out.length)continue;
    R.dias++;R.tray+=r.tray;
    r.out.forEach(({c})=>{const h=horasDe(f,c),e=h*precioDe(c),pc=R.porCasa[c.id]=R.porCasa[c.id]||{n:0,horas:0,eur:0};
      pc.n++;pc.horas+=h;pc.eur+=e;R.visitas++;R.horas+=h;R.eur+=e});
  }
  const cob=S.cobros[mesKey(y,m)]||{};
  R.cobrado=Object.entries(R.porCasa).reduce((t,[id,p])=>t+(cob[id]?p.eur:0),0);
  R.pagados=Object.keys(R.porCasa).filter(id=>cob[id]).length;
  return R;
}
const hfmt=h=>{const r=Math.round(h*10)/10;return String(r).replace(".",",")+" h"};

/* ---------- NAVEGACIÓN ---------- */
const TABS=["semana","mes","plan","casas","copia"];
function setTab(t){tab=t;editId=null;pedirBorrar=null;movId=null;pausaId=null;TABS.forEach(x=>$("tab-"+x).classList.toggle("on",x===t));render();scrollTo(0,0)}
function render(){

  $("titulo").textContent=tab==="semana"?`${LARGO[k7(d)]} ${fCorta(d)}`:tab==="mes"?(vistaAnual?`Año ${mesVista.y}`:`${Mayus(MESES[mesVista.m])} ${mesVista.y}`):{plan:"Plan fijo",casas:"Casas",copia:"Ajustes"}[tab];
  $("view").innerHTML=tab==="semana"?vSemana():tab==="mes"?(vistaAnual?vAnio():vMes()):tab==="plan"?vPlan():tab==="casas"?vCasas():vCopia();
}
function irFecha(f){fecha=f;movId=null;diaPlan=k7(fromIso(f));setTab("semana")}
function diasSinCopia(){const u=S.ajustes.ultimaCopia;return u?Math.floor((fromIso(HOY())-fromIso(u))/864e5):0}
function telLinks(c){
  if(!c.tel)return "";
  const t=c.tel.replace(/[^\d+]/g,""),wa=(t.startsWith("+")?t.slice(1):t.length===9?"34"+t:t);

}

/* ---------- SEMANA (fechas reales) ---------- */
function vSemana(){
  const d0=fromIso(fecha),L=lunes(d0),hoy=HOY();
  const p=plan(fecha),r=calc(p);
  const semana=DIAS.map((_,i)=>iso(addD(L,i)));
  let h="";
  const sc=diasSinCopia();
  h+=`<div class="weeknav"><button class="btn small" aria-label="Semana anterior" onclick="fecha='${iso(addD(d0,-7))}';render()">‹</button>
    <b>${fCorta(L)} – ${fCorta(addD(L,6))}</b>
    <button class="btn small" aria-label="Semana siguiente" onclick="fecha='${iso(addD(d0,7))}';render()">›</button>
    ${semana.includes(hoy)?"":`<button class="btn small" onclick="irFecha('${hoy}')">Hoy</button>`}</div>`;
  h+=`<div class="days">${semana.map((f,i)=>{const pp=plan(f),n=pp.paradas.length;
    return `<button class="${f===fecha?"on":""} ${f===hoy?"hoy":""} ${pp.libre?"libre":""} ${!n&&!pp.libre?"vacio":""}" onclick="fecha='${f}';movId=null;render()">${DIAS[i][1]}<b>${fromIso(f).getDate()}</b><small>${pp.libre?"🏖️":n?n+" casa"+(n>1?"s":""):"libre"}</small></button>`}).join("")}</div>`;
  h+=`<div class="sum"><div><span>Limpieza</span><b>${dur(r.trab)}</b></div><div><span>Trayectos</span><b>${dur(r.tray)}</b></div><div><span>Vuelve a</span><b>${r.out.length?hhmm(r.fin):"—"}</b></div></div>`;
  if(hayPrecio())h+=`<div class="money">💶 Este día: <b>${eur(eurDia(fecha))}</b> · Semana: <b>${eur(semana.reduce((t,f)=>t+eurDia(f),0))}</b></div>`;
  if(p.libre)h+=`<div class="banner libreb"><span>🏖️ ${p.libre.tipo==="festivo"?"Festivo":"Día libre"}${p.libre.nota?": "+esc(p.libre.nota):""}</span><button class="btn small" onclick="setTab('plan')">Ver días libres</button></div>`;
  if(p.cambiado)h+=`<div class="banner"><span>✏️ Este día tiene cambios. El plan fijo no se ha tocado.</span><button class="btn small" onclick="delete S.fechas[fecha];save();render();toast('Vuelve a lo planificado')">Deshacer cambios</button></div>`;
  if(r.out.length)h+=`<div class="start">Salgo de casa a las <input id="inicio" type="time" value="${esc(p.inicio)}" onchange="fijar(fecha).inicio=this.value||'08:00';save();render()"></div>`;
  if(!r.out.length){
    h+=p.libre?"":`<div class="empty">Día libre.</div>`;
  }else{
    const llaves=S.llaves[fecha]||[],reales=S.reales[fecha]||{};
    h+=stopHome(hhmm(toMin(p.inicio)),"Salgo de casa");
    let prev=S.home;
    r.out.forEach(({p:st,c,i,llega,sale},n)=>{
      h+=travel(prev,c,st.trayecto,`fijar(fecha).paradas[${i}].trayecto=Math.max(0,+this.value||0)`);
      const tengo=llaves.includes(c.id),kc=c.llave==="recoger"?(tengo?"ok":"warn"):"";
      h+=`<div class="stop"><div class="time">${hhmm(llega)}</div><div class="node"><div class="card">
        <div class="row between"><h3>${esc(c.nombre)}</h3><span class="meta">${hhmm(llega)}–${hhmm(sale)}</span></div>
        <div class="meta">${esc(c.direccion)} · <b>${esc(c.poblacion)}</b></div>
        <div class="row"><span class="chip">${c.horas} h</span><span class="chip ${kc}">🔑 ${LLAVE[c.llave]}${c.llaveNota?": "+esc(c.llaveNota):""}</span>${st.freq&&st.freq!=="s"?`<span class="chip soft">↻ ${FREQC[st.freq]}</span>`:""}</div>
        ${c.notas?`<div class="meta">📝 ${esc(c.notas)}</div>`:""}
        <div class="row real"><label for="hr${i}">Horas reales</label><input id="hr${i}" type="number" inputmode="decimal" step="0.25" min="0" placeholder="${c.horas}" value="${reales[c.id]??""}" onchange="setReal('${c.id}',this.value)">${reales[c.id]!=null&&reales[c.id]!==c.horas?`<span class="chip ${reales[c.id]>c.horas?"warn":""}">${reales[c.id]>c.horas?"+":""}${String(Math.round((reales[c.id]-c.horas)*100)/100).replace(".",",")} h</span>`:""}</div>
        ${movId===i?`<div class="movebox"><label>Mover a otro día<input id="movFecha" type="date" value="${fecha}"></label><div class="row"><button class="btn small pri" onclick="moverFecha(${i})">Mover</button><button class="btn small" onclick="movId=null;render()">Cancelar</button></div></div>`
        :`<div class="row">${telLinks(c)}${c.llave==="recoger"?`<button class="btn small" onclick="toggleLlave('${c.id}')">${tengo?"✓ Llave recogida":"Marcar llave"}</button>`:""}</div>
          <div class="row"><button class="btn small" aria-label="Subir" ${n===0?"disabled":""} onclick="moverOrden(${i},-1)">↑</button>
          <button class="btn small" aria-label="Bajar" ${n===r.out.length-1?"disabled":""} onclick="moverOrden(${i},1)">↓</button>
          <button class="btn small" onclick="movId=${i};render()">Mover</button>
          <button class="btn small" onclick="quitarDia(${i})">Quitar</button></div>`}
      </div></div></div>`;
      prev=c;
    });
    h+=travel(prev,S.home,p.vuelta,`fijar(fecha).vuelta=Math.max(0,+this.value||0)`);
    h+=stopHome(hhmm(r.fin),"Vuelta a casa");
  }
  h+=S.casas.length?`<div class="add"><select id="addCasa">${S.casas.map(c=>`<option value="${c.id}">${esc(c.nombre)} · ${esc(c.poblacion)}</option>`).join("")}</select><button class="btn pri" onclick="addDia()">Añadir solo este día</button></div>
    <div class="meta" style="margin-top:6px">Para que una casa se repita sola, añádela en <a href="#" onclick="event.preventDefault();setTab('plan')">Plan fijo</a>.</div>`
    :`<div class="add"><button class="btn pri" onclick="setTab('casas')">Crear la primera casa</button></div>`;
  return h;
}
function stopHome(t,txt){return `<div class="stop"><div class="time">${t}</div><div class="node home"><div class="card"><h3>${txt}</h3><div class="meta">${esc(full(S.home))||"Pon tu dirección en Casas"}</div></div></div></div>`}
function travel(a,b,min,set){return `<div class="travel"><div></div><div class="node"><div class="trip">🚌 <input type="number" inputmode="numeric" min="0" value="${+min||0}" onchange="${set};save();render()"> min · <a href="${maps(a,b)}" target="_blank" rel="noopener">Ver ruta</a></div></div></div>`}
function moverOrden(i,dx){const a=fijar(fecha).paradas;[a[i],a[i+dx]]=[a[i+dx],a[i]];save();render()}
function quitarDia(i){fijar(fecha).paradas.splice(i,1);save();render();toast("Quitada solo de este día")}
function toggleLlave(id){const l=S.llaves[fecha]=S.llaves[fecha]||[];const j=l.indexOf(id);j<0?l.push(id):l.splice(j,1);save();render()}
function setReal(id,v){const o=S.reales[fecha]=S.reales[fecha]||{};if(v===""||isNaN(+v))delete o[id];else o[id]=Math.max(0,+v);if(!Object.keys(o).length)delete S.reales[fecha];save();render()}
function addDia(){const id=$("addCasa").value;if(!id)return;fijar(fecha).paradas.push({casa:id,trayecto:S.ajustes.trayecto});save();render();toast("Añadida solo este día")}
function moverFecha(i){
  const dest=$("movFecha").value;
  if(!dest||dest===fecha){movId=null;render();return}
  const destino=fijar(dest),[st]=fijar(fecha).paradas.splice(i,1);
  destino.paradas.push(st);movId=null;save();render();toast(`Movida al ${fCorta(fromIso(dest))}`);

/* ---------- MES ---------- */
function segMesAnio(){return `<div class="seg" style="margin-bottom:10px"><button class="${vistaAnual?"":"on"}" onclick="vistaAnual=false;render()">Mes</button><button class="${vistaAnual?"on":""}" onclick="vistaAnual=true;render()">Año</button></div>`}

  <div class="cal">${["L","M","X","J","V","S","D"].map(x=>`<div class="ch">${x}</div>`).join("")}`;
  for(let i=0;i<42;i++){
    const d=addD(ini,i);if(i>=35&&d.getMonth()!==m)break;

    h+=`<button class="cd ${dentro?"":"fuera"} ${f===hoy?"hoy":""} ${f===fecha?"sel":""} ${r.out.length?"lleno":""} ${p.libre?"libre":""}" onclick="irFecha('${f}')">
      <span class="n">${d.getDate()}${p.cambiado?'<i class="mk" title="Con cambios"></i>':""}</span>
      ${r.out.length?`<span class="c">${r.out.length}</span><span class="hh">${hfmt(r.trab/60)}</span>`:p.libre?`<span class="hh">${p.libre.tipo==="festivo"?"Fest.":"Libre"}</span>`:""}</button>`;
  }
  h+=`</div><div class="sum" style="margin-top:14px"><div><span>Días</span><b>${R.dias}</b></div><div><span>Limpieza</span><b>${hfmt(R.horas)}</b></div><div><span>Trayectos</span><b>${dur(R.tray)}</b></div></div>`;
  if(conPrecio)h+=`<div class="money">💶 Total: <b>${eur(R.eur)}</b> · Cobrado: <b>${eur(R.cobrado)}</b> · Pendiente: <b>${eur(R.eur-R.cobrado)}</b></div>`;
  const filas=Object.entries(R.porCasa).sort((a,b)=>b[1].eur-a[1].eur||b[1].n-a[1].n);
  h+=`<div class="card"><h3>${conPrecio?"Cobros del mes":"Visitas del mes"} (${R.visitas} visitas)</h3>

  const filas=MESES.map((nm,m)=>{const R=resumenMes(y,m);["dias","visitas","horas","eur","cobrado"].forEach(k=>T[k]+=R[k]);
    const actual=y===hoy.getFullYear()&&m===hoy.getMonth(),clientes=Object.keys(R.porCasa).length;

const hoy=()=>new Date().toISOString().slice(0,10);
async function entregar(nombre,texto,tipo){
  const blob=new Blob([texto],{type:tipo});
  try{
    const file=new File([blob],nombre,{type:tipo});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:nombre});return true}
  }catch(e){if(e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Archivo descargado");return true;
}
function exportCSV(y,m){
  if(y===undefined){const d=new Date();y=d.getFullYear();m=d.getMonth()}
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const filas=[["Fecha","Día","Orden","Llegada","Salida","Cliente","Población","Dirección","Horas plan","Horas reales","Precio/h","Importe","Trayecto (min)","Llave","Dónde llave","Notas"]];
  const num=v=>String(Math.round(v*100)/100).replace(".",",");
  for(let d=new Date(y,m,1);d.getMonth()===m;d=addD(d,1)){
    const f=iso(d);calc(plan(f)).out.forEach(({c,p,llega,sale},n)=>filas.push([`${pad(d.getDate())}/${pad(m+1)}/${y}`,LARGO[k7(d)],n+1,hhmm(llega),hhmm(sale),c.nombre,c.poblacion,c.direccion,num(c.horas),num(horasDe(f,c)),num(precioDe(c)),num(horasDe(f,c)*precioDe(c)),p.trayecto,LLAVE[c.llave],c.llaveNota,c.notas]));
  }
  entregar(`ruta-${MESES[m]}-${y}.csv`,"\ufeff"+filas.map(f=>f.map(q).join(";")).join("\r\n"),"text/csv");
}
function setAj(k,v){S.ajustes[k]=v;save();if(k==="tema")aplicarTema();if(k!=="trayecto"&&k!=="precio"&&k!=="inicio")render();else toast("Guardado")}
const eur=n=>n.toLocaleString("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:2});
async function exportJSON(){if(await entregar(`copia-ruta-${hoy()}.json`,JSON.stringify(S,null,1),"application/json")){S.ajustes.ultimaCopia=iso(new Date());save();render()}}
function restaurar(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.casas)||!d.semana)throw 0;S=d;normalizar();save();setTab("semana");toast("Copia restaurada")}catch(e){toast("Ese archivo no es una copia válida")}};
  r.readAsText(f);
}
